aid: feroot
name: Feroot
description: 'Feroot Security is a Toronto-based cybersecurity company providing AI-powered
  client-side (browser) security and compliance automation for websites and mobile apps.
  Its platform gives organizations visibility into the third-party JavaScript, trackers,
  cookies, and data flows running in the browser, and automates compliance with PCI DSS
  4.0.1 (requirements 6.4.3 script inventory and 11.6.1 tamper detection), HIPAA, GDPR,
  CCPA/CPRA, and 50+ global regulations. Products include DXComply (privacy compliance
  and consent auditing), PaymentGuard (PCI DSS 4.0.1 automation for payment pages), and
  DXSecure (real-time client-side script security against formjacking, Magecart, and data
  exfiltration). Feroot is SOC 2 Type 2 certified and a PCI Security Standards Council
  Associate Member. Backed by Y Combinator, True Ventures, Haystack, and Stonemill Ventures.'
